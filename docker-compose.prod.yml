services:
  # Backend API (ASP.NET Core)
  # Unique container_name so nginx API_UPSTREAM never resolves a sibling stack's
  # short Compose service name on a shared Docker network.
  delegat-api:
    image: ghcr.io/akhilya/delegat-module/api:${IMAGE_TAG:-latest}
    container_name: ${API_CONTAINER_NAME:-delegat-prod-api}
    pull_policy: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MYSQL_SERVER=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_SECURE=false
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_PUBLIC_SECURE=${MINIO_PUBLIC_SECURE:-false}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FORCE_RESET=${ADMIN_FORCE_RESET:-false}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-}
      - INSTANCE_ID=${INSTANCE_ID:-}
      - INSTANCE_LINK_SECRET=${INSTANCE_LINK_SECRET:-}
      - PLATFORM_CATALOG_REFRESH_MINUTES=${PLATFORM_CATALOG_REFRESH_MINUTES:-360}
      - PLATFORM_HEARTBEAT_MINUTES=${PLATFORM_HEARTBEAT_MINUTES:-5}
      - AI_ENABLED=${AI_ENABLED:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - delegat-network
    restart: unless-stopped

  # Frontend (Nginx + Vue SPA)
  # No depends_on api: SPA stays routable and shows /unavailable when API is down.
  # Healthcheck is nginx-only (/health). Do not point Traefik/Dokploy at /api/health.
  frontend:
    image: ghcr.io/akhilya/delegat-module/frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      # Must match delegat-api container_name (not the short Compose service name).
      - API_UPSTREAM=${API_CONTAINER_NAME:-delegat-prod-api}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - delegat-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.4
    command: >
      --innodb-lock-wait-timeout=3600
      --lock-wait-timeout=3600
      --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      --performance-schema=OFF
      --max-connections=50
      --skip-name-resolve
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - delegat-network
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - delegat-network
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      mc anonymous set none myminio/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    networks:
      - delegat-network

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-delegat-mysql-data}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-delegat-minio-data}

networks:
  delegat-network:
    driver: bridge
