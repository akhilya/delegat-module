# Production / Dokploy deployment
# Connects to existing Dokploy MySQL and MinIO services

services:
  # Backend API (ASP.NET Core)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MYSQL_SERVER=${MYSQL_SERVER:-system-database-l6vnfd}
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-printo}
      - MYSQL_USER=${MYSQL_USER:-printo}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-system-minio-ecslls-minio-1:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-printo}
      - MINIO_SECURE=false
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-printo.studio}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-printo.studio}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    networks:
      - dokploy-network
    restart: unless-stopped

  # Frontend (Vue 3 + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_SERVER=${VITE_API_SERVER:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
