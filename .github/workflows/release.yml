name: Release

on:
  push:
    branches: [main]
    paths: ['VERSION']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Release runs on push to main (Actions secrets available). Fallback keeps
          # the workflow from failing with an empty token if the secret is unset.
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"      >> $GITHUB_OUTPUT
          echo "major=$MAJOR"       >> $GITHUB_OUTPUT
          echo "minor=$MINOR"       >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.major }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.major }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Delegat.Module ${{ steps.version.outputs.tag }}
          generate_release_notes: true
