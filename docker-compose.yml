# Development - infrastructure services only
# Usage: docker compose up -d
# Python sidecar (`sandbox`) is profile `ai` — started only when AI is on
# (`pnpm dev` reads AI_ENABLED from .env.dev). Raw compose:
#   docker compose --profile ai up     # AI on
#   docker compose up                  # AI off (does not create sandbox)
# Then run backend and frontend locally with: npm run dev

name: delegat-dashboard

services:
  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: delegat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - delegat-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: quay.io/minio/minio:latest
    container_name: delegat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - delegat-network

  sandbox:
    profiles: ["ai"]
    build:
      context: ./sandbox/python
      dockerfile: Dockerfile
    container_name: delegat-sandbox
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET:-}
      SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-30}
      SANDBOX_CPU_THREADS: ${SANDBOX_CPU_THREADS:-1}
      SANDBOX_AS_MB: ${SANDBOX_AS_MB:-384}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8080"
    # Keep the host usable: half a CPU, 512 MiB RAM, no extra swap.
    cpus: ${SANDBOX_CPUS:-0.50}
    cpu_shares: 128
    mem_limit: ${SANDBOX_MEM_LIMIT:-512m}
    memswap_limit: ${SANDBOX_MEM_LIMIT:-512m}
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - delegat-network

  # MinIO bucket initialization
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: delegat-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      mc anonymous set public myminio/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    networks:
      - delegat-network

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-delegat-mysql-data}
  # Reusing a volume from an older compose project (printo-dashboard_*) prints a
  # warning and still mounts the existing data. Harmless.
  minio_data:
    name: ${MINIO_VOLUME_NAME:-delegat-minio-data}

networks:
  delegat-network:
    driver: bridge
